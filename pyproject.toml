[project]
name = "didactic-adventure"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "joblib",
    "numpy",
    "pandas",
    "polars",
    "pyarrow",
    "scikit-learn",
    "xgboost-cpu",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/framework", "models", "steps", "pipelines"]


[dependency-groups]
mlops = ["mlflow", "zenml[local,server]"]
dev = [
    "ruff",
    "mypy",
    "bandit[toml]",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "ipykernel",
]


[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "PD"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# First-party code must always resolve; never let it silently become `Any`.
module = ["framework.*", "models.*", "steps.*", "pipelines.*"]
ignore_missing_imports = false

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]
# Fail on unknown markers, config typos, duplicate parametrize ids and passing xfails.
strict = true
