name: CI

on:
  # Branches are checked through their pull request; main again after each merge.
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy .

      - name: Bandit
        run: uv run bandit -r . -x .venv -c pyproject.toml

      - name: Tests
        run: uv run pytest

  # Heavier dependencies than `quality`: the ZenML pipelines are checked in their own job.
  pipelines:
    runs-on: ubuntu-latest
    env:
      ZENML_ANALYTICS_OPT_IN: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen --group mlops

      - name: Mypy
        run: uv run --frozen --group mlops mypy .

      - name: Pipeline tests
        run: uv run --frozen --group mlops pytest tests/test_training_pipeline.py

  # The image must build and pass the tests on its own, without the host's code or packages.
  docker:
    runs-on: ubuntu-latest
    env:
      # The Dockerfile's cache mounts need BuildKit; do not depend on the runner's default.
      DOCKER_BUILDKIT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build image
        run: docker compose build

      - name: Tests inside the image
        run: docker run --rm -e ZENML_ANALYTICS_OPT_IN=false didactic-adventure:dev pytest
