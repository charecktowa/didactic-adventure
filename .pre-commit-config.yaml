repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.6
    hooks:
      # Run the linter (check-only, does not modify files).
      - id: ruff-check
      # Run the formatter in check mode (does not modify files).
      - id: ruff-format
        args: [--check]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        args: [--config-file=pyproject.toml]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: ["-r", ".", "-x", ".venv", "-c", "pyproject.toml"]
        pass_filenames: false
